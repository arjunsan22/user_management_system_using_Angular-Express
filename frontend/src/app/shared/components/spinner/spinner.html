<div 
  class="flex flex-col items-center justify-center gap-3"
  [class.fixed]="isOverlay()"
  [class.inset-0]="isOverlay()"
  [class.bg-slate-900/40]="isOverlay()"
  [class.backdrop-blur-sm]="isOverlay()"
  [class.z-50]="isOverlay()"
  [class.p-8]="!isOverlay()">
  
  <!-- Animated Spinner Circle -->
  <div 
    class="border-indigo-600 border-t-transparent rounded-full animate-spin"
    [class.w-5]="size() === 'sm'"
    [class.h-5]="size() === 'sm'"
    [class.border-2]="size() === 'sm'"
    [class.w-10]="size() === 'md'"
    [class.h-10]="size() === 'md'"
    [class.border-4]="size() === 'md'"
    [class.w-16]="size() === 'lg'"
    [class.h-16]="size() === 'lg'"
    [class.border-[6px]]="size() === 'lg'">
  </div>

  <!-- Optional Loading Text -->
  @if (message()) {
    <p class="text-sm font-medium text-gray-500 animate-pulse tracking-wide">
      {{ message() }}
    </p>
  }
</div>
